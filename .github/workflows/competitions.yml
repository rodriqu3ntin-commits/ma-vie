name: Mise à jour des compétitions

# CFJJB et Smoothcomp bloquent les serveurs de GitHub (403) : la mise à jour
# quotidienne passe par le navigateur de l'ordinateur de Quentin. Ce workflow
# reste disponible à la main, au cas où les sites lèveraient ce blocage.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: competitions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter CFJJB, Smoothcomp et France Judo
        run: python scripts/update_competitions.py
      - name: Publier si quelque chose a changé
        run: |
          if git diff --quiet -- competitions.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "ma-vie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions.json
          git commit -m "Compétitions mises à jour ($(date -u +%Y-%m-%d))"
          git push
