name: Mise à jour des compétitions

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch: {}
  push:
    paths:
      - scripts/update_competitions.py
      - .github/workflows/competitions.yml

permissions:
  contents: write

concurrency:
  group: competitions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter CFJJB, Smoothcomp et France Judo
        run: python scripts/update_competitions.py
      - name: Publier si quelque chose a changé
        run: |
          if git diff --quiet -- competitions.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "ma-vie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions.json
          git commit -m "Compétitions mises à jour ($(date -u +%Y-%m-%d))"
          git push
